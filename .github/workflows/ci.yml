name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Verify imports
        run: |
          python -c "import sa_zd_nids"
          python -c "from sa_zd_nids.data.preprocessing import DataPreprocessor"
          python -c "from sa_zd_nids.models.autoencoder import AutoencoderNet"
          python -c "from sa_zd_nids.models.classifier import KnownAttackClassifier"
          python -c "from deployment.api.main import app; print(app.title)"

      - name: Run tests
        run: python -m pytest -vv --maxfail=1

      - name: Lint
        run: python -m flake8 --max-line-length=120 --extend-ignore=E203,W503 src tests
