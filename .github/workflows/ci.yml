name: CI
# Zero-day Intrusion Detection System CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        check-latest: true
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Install project
      run: |
        pip install -e .
    
    - name: Verify package import
      run: |
        python -c "import sa_zd_nids"
        python -c "from sa_zd_nids.models.autoencoder import AutoencoderNet"
        python -c "from sa_zd_nids.models.classifier import KnownAttackClassifier"
        tree src
    
    - name: Run tests with pytest
      run: |
        pytest
    
    - name: Run linting with flake8
      run: |
        flake8 --max-line-length=88 --extend-ignore=E203,W503 src tests
