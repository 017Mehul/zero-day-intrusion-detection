name: CI\n# SA-ZD-NIDS continuous integration\n\non:\n  push:\n    branches: [main, master]\n  pull_request:\n    branches: [main, master]\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n      matrix:\n        python-version: ["3.10"]\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: ${{ matrix.python-version }}\n          cache: pip\n\n      - name: Install dependencies\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install -r requirements.txt\n          python -m pip install -r requirements-dev.txt\n          python -m pip install -e .\n\n      - name: Verify package imports\n        run: |\n          python -c "import sa_zd_nids"\n          python -c "from sa_zd_nids.data.preprocessing import DataPreprocessor"\n          python -c "from sa_zd_nids.models.autoencoder import AutoencoderNet"\n          python -c "from sa_zd_nids.models.classifier import KnownAttackClassifier"\n          python -c "from deployment.api.main import app; print(app.title)"\n\n      - name: Run tests\n        run: python -m pytest -vv --maxfail=1\n\n      - name: Run lint\n        run: python -m flake8 --max-line-length=100 --extend-ignore=E203,W503 src tests\n