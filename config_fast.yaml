project:
  random_state: 42
  log_level: INFO

data:
  dataset_name: cicids2017
  input_path: data/processed.csv
  timestamp_col: timestamp
  label_col: label
  benign_label: BENIGN
  drop_columns: []
  test_size: 0.2
  val_size: 0.1
  scale: standard
  batch_size: 256

features:
  impute_strategy: median
  mutual_info_k: 20
  use_mutual_info: true

classifier:
  model_type: xgboost
  use_gpu: true
  confidence_threshold: 0.70
  xgboost:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
  random_forest:
    n_estimators: 100
    max_depth: 12

anomaly:
  train_on_normal_only: true
  use_gpu: true
  hidden_dims: [64, 32, 16]
  epochs: 10
  batch_size: 512
  learning_rate: 0.001
  threshold_percentile: 95

drift:
  adwin_delta: 0.002
  window_size: 1000
  min_adapt_samples: 500
  confidence_low_threshold: 0.55
  accuracy_weight: 0.6
  confidence_weight: 0.3
  feature_shift_weight: 0.1
  past_replay_fraction: 0.3
  adapt_validation_fraction: 0.2
  adapt_accept_tolerance: 0.0

streaming:
  batch_size: 500
  max_batches: null
  adaptation_history_keep: 3

logging:
  output_csv: logs/stream_predictions.csv
  events_jsonl: logs/events.jsonl
  metrics_json: logs/metrics_summary.json
